<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grille de fond -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Centre de symétrie O -->
  <circle cx="200" cy="150" r="6" fill="#0066cc" stroke="#000000" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">O</text>
  
  <!-- Droite (d) -->
  <line x1="100" y1="100" x2="300" y2="120" stroke="#ff0000" stroke-width="2"/>
  <text x="310" y="125" font-family="Arial" font-size="12" fill="#ff0000">(d)</text>
  
  <!-- Droite (d') image de (d) -->
  <line x1="100" y1="200" x2="300" y2="220" stroke="#00cc00" stroke-width="2"/>
  <text x="310" y="225" font-family="Arial" font-size="12" fill="#00cc00">(d')</text>
  
  <!-- Points sur la droite (d) -->
  <circle cx="120" cy="104" r="3" fill="#ff0000"/>
  <circle cx="200" cy="113" r="3" fill="#ff0000"/>
  <circle cx="280" cy="122" r="3" fill="#ff0000"/>
  
  <!-- Images des points sur (d') -->
  <circle cx="120" cy="204" r="3" fill="#00cc00"/>
  <circle cx="200" cy="213" r="3" fill="#00cc00"/>
  <circle cx="280" cy="222" r="3" fill="#00cc00"/>
  
  <!-- Lignes reliant les points symétriques à O -->
  <line x1="120" y1="104" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="120" y1="204" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="200" y1="113" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="200" y1="213" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="122" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="222" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Légende -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">(d) et (d') sont parallèles</text>
</svg>
