<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grille de fond -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Centre de symétrie O -->
  <circle cx="200" cy="150" r="6" fill="#0066cc" stroke="#000000" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">O</text>
  
  <!-- Point A -->
  <circle cx="150" cy="120" r="4" fill="#ff0000" stroke="#000000" stroke-width="1"/>
  <text x="155" y="125" font-family="Arial" font-size="12" fill="#000000">A</text>
  
  <!-- Point A' (image de A) -->
  <circle cx="250" cy="180" r="4" fill="#ff0000" stroke="#000000" stroke-width="1"/>
  <text x="255" y="185" font-family="Arial" font-size="12" fill="#000000">A'</text>
  
  <!-- Droite (OA) -->
  <line x1="150" y1="120" x2="250" y2="180" stroke="#ff0000" stroke-width="2"/>
  
  <!-- Segments [OA] et [OA'] -->
  <line x1="150" y1="120" x2="200" y2="150" stroke="#ff0000" stroke-width="1"/>
  <line x1="250" y1="180" x2="200" y2="150" stroke="#ff0000" stroke-width="1"/>
  
  <!-- Marqueurs de longueur égale -->
  <line x1="145" y1="115" x2="145" y2="125" stroke="#ff0000" stroke-width="1"/>
  <line x1="140" y1="120" x2="150" y2="120" stroke="#ff0000" stroke-width="1"/>
  <line x1="255" y1="175" x2="255" y2="185" stroke="#ff0000" stroke-width="1"/>
  <line x1="250" y1="180" x2="260" y2="180" stroke="#ff0000" stroke-width="1"/>
  
  <!-- Légende -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">OA = OA' et O est le milieu de [AA']</text>
</svg>
