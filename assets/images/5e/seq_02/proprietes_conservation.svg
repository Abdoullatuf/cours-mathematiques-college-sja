<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grille de fond -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Centre de symétrie O -->
  <circle cx="200" cy="150" r="6" fill="#0066cc" stroke="#000000" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">O</text>
  
  <!-- Triangle ABC -->
  <polygon points="120,100 180,100 150,140" fill="#ffcccc" stroke="#ff0000" stroke-width="2"/>
  <circle cx="120" cy="100" r="3" fill="#ff0000"/>
  <circle cx="180" cy="100" r="3" fill="#ff0000"/>
  <circle cx="150" cy="140" r="3" fill="#ff0000"/>
  <text x="115" y="95" font-family="Arial" font-size="12" fill="#000000">A</text>
  <text x="185" y="95" font-family="Arial" font-size="12" fill="#000000">B</text>
  <text x="155" y="145" font-family="Arial" font-size="12" fill="#000000">C</text>
  
  <!-- Triangle A'B'C' (image de ABC) -->
  <polygon points="280,200 220,200 250,160" fill="#ccffcc" stroke="#00cc00" stroke-width="2"/>
  <circle cx="280" cy="200" r="3" fill="#00cc00"/>
  <circle cx="220" cy="200" r="3" fill="#00cc00"/>
  <circle cx="250" cy="160" r="3" fill="#00cc00"/>
  <text x="285" y="195" font-family="Arial" font-size="12" fill="#000000">A'</text>
  <text x="215" y="195" font-family="Arial" font-size="12" fill="#000000">B'</text>
  <text x="245" y="155" font-family="Arial" font-size="12" fill="#000000">C'</text>
  
  <!-- Lignes reliant les points symétriques à O -->
  <line x1="120" y1="100" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="200" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="180" y1="100" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="220" y1="200" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="150" y1="140" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="250" y1="160" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Marqueurs d'angles -->
  <path d="M 125,105 L 135,105 L 130,115 Z" fill="#ff0000"/>
  <path d="M 275,195 L 265,195 L 270,185 Z" fill="#00cc00"/>
  
  <!-- Légende -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">AB = A'B', angles conservés, aires égales</text>
</svg>
