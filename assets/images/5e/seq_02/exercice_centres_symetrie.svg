<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grille de fond -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Rectangle (centrosymétrique) -->
  <rect x="50" y="50" width="60" height="40" fill="#ffcccc" stroke="#ff0000" stroke-width="2"/>
  <circle cx="80" cy="70" r="2" fill="#0066cc"/>
  <text x="80" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">Rectangle</text>
  
  <!-- Triangle équilatéral (non centrosymétrique) -->
  <polygon points="150,50 180,50 165,90" fill="#ccffcc" stroke="#00cc00" stroke-width="2"/>
  <text x="165" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">Triangle</text>
  
  <!-- Cercle (centrosymétrique) -->
  <circle cx="250" cy="70" r="20" fill="#ccccff" stroke="#0000cc" stroke-width="2"/>
  <circle cx="250" cy="70" r="2" fill="#0066cc"/>
  <text x="250" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">Cercle</text>
  
  <!-- Losange (centrosymétrique) -->
  <polygon points="350,50 370,70 350,90 330,70" fill="#ffffcc" stroke="#cccc00" stroke-width="2"/>
  <circle cx="350" cy="70" r="2" fill="#0066cc"/>
  <text x="350" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">Losange</text>
  
  <!-- Trapèze (non centrosymétrique) -->
  <polygon points="50,180 90,180 80,220 60,220" fill="#ffccff" stroke="#cc00cc" stroke-width="2"/>
  <text x="70" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">Trapèze</text>
  
  <!-- Carré (centrosymétrique) -->
  <rect x="150" y="160" width="40" height="40" fill="#ccffff" stroke="#00cccc" stroke-width="2"/>
  <circle cx="170" cy="180" r="2" fill="#0066cc"/>
  <text x="170" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">Carré</text>
  
  <!-- Parallélogramme (centrosymétrique) -->
  <polygon points="220,160 260,160 250,200 210,200" fill="#ffcc99" stroke="#cc6600" stroke-width="2"/>
  <circle cx="235" cy="180" r="2" fill="#0066cc"/>
  <text x="235" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">Parallélogramme</text>
  
  <!-- Légende -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Identifier les figures centrosymétriques</text>
</svg>
