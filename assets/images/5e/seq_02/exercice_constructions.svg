<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grille de fond -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Centre de symétrie O -->
  <circle cx="200" cy="150" r="6" fill="#0066cc" stroke="#000000" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">O</text>
  
  <!-- Point M -->
  <circle cx="150" cy="100" r="4" fill="#ff0000" stroke="#000000" stroke-width="1"/>
  <text x="155" y="105" font-family="Arial" font-size="12" fill="#000000">M</text>
  
  <!-- Segment [PQ] -->
  <line x1="120" y1="180" x2="180" y2="180" stroke="#00cc00" stroke-width="2"/>
  <circle cx="120" cy="180" r="3" fill="#00cc00"/>
  <circle cx="180" cy="180" r="3" fill="#00cc00"/>
  <text x="125" y="175" font-family="Arial" font-size="12" fill="#000000">P</text>
  <text x="185" y="175" font-family="Arial" font-size="12" fill="#000000">Q</text>
  
  <!-- Droite (d) -->
  <line x1="100" y1="220" x2="300" y2="220" stroke="#cc00cc" stroke-width="2"/>
  <text x="310" y="225" font-family="Arial" font-size="12" fill="#cc00cc">(d)</text>
  
  <!-- Cercle C -->
  <circle cx="320" cy="100" r="15" fill="none" stroke="#0000cc" stroke-width="2"/>
  <circle cx="320" cy="100" r="2" fill="#0000cc"/>
  <text x="325" y="105" font-family="Arial" font-size="12" fill="#000000">A</text>
  <circle cx="335" cy="100" r="2" fill="#0000cc"/>
  <text x="340" y="105" font-family="Arial" font-size="12" fill="#000000">B</text>
  <text x="320" y="130" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">C</text>
  
  <!-- Lignes reliant à O -->
  <line x1="150" y1="100" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="120" y1="180" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="180" y1="180" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="320" y1="100" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Légende -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Construire les images de toutes les figures</text>
</svg>
