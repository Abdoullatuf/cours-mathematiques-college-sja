<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grille de fond -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Centre de symétrie O -->
  <circle cx="200" cy="150" r="6" fill="#0066cc" stroke="#000000" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">O</text>
  
  <!-- Triangle ABC -->
  <polygon points="120,100 180,100 150,140" fill="#ffcccc" stroke="#ff0000" stroke-width="2"/>
  <circle cx="120" cy="100" r="3" fill="#ff0000"/>
  <circle cx="180" cy="100" r="3" fill="#ff0000"/>
  <circle cx="150" cy="140" r="3" fill="#ff0000"/>
  <text x="115" y="95" font-family="Arial" font-size="12" fill="#000000">A</text>
  <text x="185" y="95" font-family="Arial" font-size="12" fill="#000000">B</text>
  <text x="155" y="145" font-family="Arial" font-size="12" fill="#000000">C</text>
  
  <!-- Légende -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Construire l'image du triangle ABC</text>
</svg>
