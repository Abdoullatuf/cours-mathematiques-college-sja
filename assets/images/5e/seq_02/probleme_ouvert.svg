<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grille de fond -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Centre de symétrie O -->
  <circle cx="200" cy="150" r="6" fill="#0066cc" stroke="#000000" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">O</text>
  
  <!-- Quadrilatère ABCD -->
  <polygon points="120,100 280,100 260,200 140,200" fill="#ffcccc" stroke="#ff0000" stroke-width="2"/>
  <circle cx="120" cy="100" r="3" fill="#ff0000"/>
  <circle cx="280" cy="100" r="3" fill="#ff0000"/>
  <circle cx="260" cy="200" r="3" fill="#ff0000"/>
  <circle cx="140" cy="200" r="3" fill="#ff0000"/>
  <text x="115" y="95" font-family="Arial" font-size="12" fill="#000000">A</text>
  <text x="285" y="95" font-family="Arial" font-size="12" fill="#000000">B</text>
  <text x="265" y="205" font-family="Arial" font-size="12" fill="#000000">C</text>
  <text x="135" y="205" font-family="Arial" font-size="12" fill="#000000">D</text>
  
  <!-- Diagonales -->
  <line x1="120" y1="100" x2="260" y2="200" stroke="#666666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="100" x2="140" y2="200" stroke="#666666" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Lignes reliant les points à O -->
  <line x1="120" y1="100" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="100" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="260" y1="200" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="140" y1="200" x2="200" y2="150" stroke="#cccccc" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Légende -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Construire A'B'C'D' et analyser les propriétés</text>
</svg>
